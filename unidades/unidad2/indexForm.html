<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Explicacion form</title>
</head>
<body>
<h2>Formulario 1</h2>
<form id="idForm1" name="nDatos1">
	<br>
	<label for="idNombre"></label><input type="text" id="idNombre" name="nTexto" value="valor del texto">
	<br>
	<br>
	<label for="idUrl"></label><input type="url" id="idUrl" name="nUrl" value="https://iesmartinezm.es">
</form>

<br>
<br>
<br>

<h2>Formulario 2</h2>
<form id="idForm2" name="nDatos2">
	<label for="idTexto1">Input text</label>
	<input type="text" id="idTexto1" name="nTexto1" value="valor del texto 1">
	<br>
	<br>
	
	<label for="idTextArea1">Text Area</label>
	<textarea id="idTextArea1" name="nTextArea1" rows="10" cols="20"
	          placeholder="Escribe lo que te de la gana"></textarea>
	
	<br>
	<br>
	
	<label for="idRadiobtn1">Si
		<input type="radio" id="idRadiobtn1" name="nRadiobtns" value="si" checked="checked">
	</label>
	<label for="idRadiobtn2">No
		<input type="radio" id="idRadiobtn2" name="nRadiobtns" value="no">
	</label>
	
	<br>
	<br>
	
	<label for="idCheck1">Bocadillo</label>
	<input type="checkbox" id="idCheck1" name="comidas" value="bocadillo">
	<br>
	<label for="idCheck2">Fruta</label>
	<input type="checkbox" id="idCheck2" name="comidas" value="fruta">
	<br>
	<label for="idCheck3">Pastelito</label>
	<input type="checkbox" id="idCheck3" name="comidas" value="pastelito" checked="checked">
	
	<br>
	<br>
	
	<label for="idLenguajes">Elige un lenguaje
		<select id="idLenguajes">
			<option value="0" disabled selected>Seleccione una opcion</option>
			<option value="1">Javascript</option>
			<option value="2">C++</option>
			<option value="3">C</option>
			<option value="4">Rust</option>
			<option value="5">PHP</option>
		</select>
	</label>

	<br>
	<br>
	
	<label>
		<input type="text" list="idFrutas" id="idFrutas1">
		<datalist id="idFrutas">
			<option value="1">Sandía</option>
			<option value="2">Melón</option>
			<option value="3">Manzana</option>
			<option value="4">Aguacate</option>
		</datalist>
	</label>
</form>

<script src="js/12.formularios.js"></script>
</body>
</html>
