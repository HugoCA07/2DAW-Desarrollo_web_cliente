<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Drag and drop</title>
	<style>
        .cajaRoja, .cajaAzul {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .cajaRoja {
            background-color: #e11d48;
        }

        .cajaAzul {
            background-color: #2563eb;
        }

        .contenedor {
            width: 212px;
            height: 212px;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            margin: 20px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
	
	</style>
</head>
<body>
<div class="cajaRoja" draggable="true"></div>
<div class="cajaAzul" draggable="true"></div>
<div class="contenedor"></div>
<script src="js/10.dragAndDrop.js"></script>
</body>
</html>
